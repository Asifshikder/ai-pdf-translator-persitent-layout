<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Translator — English to Bangla</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    display: flex; margin: 0; min-height: 100vh;
    background: #f4f5f7; color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #16181d; color: #e8e8e8; }
  }

  .sidebar {
    width: 240px; padding: 1.5rem 1rem; border-right: 1px solid #e0e0e0;
    background: #fff; flex-shrink: 0;
    display: flex; flex-direction: column;
  }
  @media (prefers-color-scheme: dark) {
    .sidebar { background: #1f232b; border-right-color: #3a3f48; }
  }

  .sidebar h2 { margin: 0 0 1rem; font-size: .95rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .05em; opacity: .6; }

  .sidebar-option {
    margin-bottom: .5rem; padding: .7rem .9rem; border-radius: 8px;
    cursor: pointer; font-size: .95rem; border: none; background: transparent;
    color: inherit; text-align: left; font-family: inherit; transition: all .15s;
  }
  .sidebar-option:hover { background: rgba(47,111,237,.1); }
  .sidebar-option.active {
    background: #2f6fed; color: #fff; font-weight: 600;
  }

  .sidebar-link {
    display: block; margin-top: .75rem; padding: .7rem .9rem; border-radius: 8px;
    font-size: .95rem; color: inherit; text-decoration: none;
    border: 1px dashed rgba(127,127,127,.45); transition: all .15s;
  }
  .sidebar-link:hover { background: rgba(47,111,237,.1); border-color: #2f6fed; }

  .main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 2rem;
  }

  .card {
    background: #fff; border-radius: 12px; padding: 2.5rem;
    width: 100%; max-width: 700px; box-shadow: 0 4px 24px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    .card { background: #1f232b; }
  }

  h1 { font-size: 1.6rem; margin: 0 0 .3rem; }
  p.sub { margin: 0 0 1.75rem; opacity: .7; font-size: .95rem; }

  #drop {
    border: 2px dashed #bbb; border-radius: 10px; padding: 3rem 2rem;
    text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
    min-height: 200px; display: flex; align-items: center; justify-content: center;
    flex-direction: column;
  }
  @media (prefers-color-scheme: dark) {
    #drop { border-color: #444; }
  }
  #drop.over { border-color: #2f6fed; background: rgba(47,111,237,.06); }
  #drop span { opacity: .75; font-size: 1rem; }
  #fileName { margin-top: 1rem; font-size: .95rem; font-weight: 600; word-break: break-all; }

  button {
    margin-top: 1.75rem; width: 100%; padding: .85rem; font-size: 1rem;
    border: 0; border-radius: 8px; background: #2f6fed; color: #fff;
    cursor: pointer; font-weight: 600; transition: opacity .15s;
  }
  button:hover:not(:disabled) { opacity: .9; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  #status { margin-top: 1.25rem; font-size: .95rem; min-height: 1.3em; text-align: center; }
  #status.error { color: #d33; }

  #hint { margin: 1rem 0 0; opacity: .75; font-size: .9rem; line-height: 1.5; }

  .spinner {
    display: inline-block; width: 16px; height: 16px; vertical-align: -3px;
    border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin .7s linear infinite; margin-right: .5rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="sidebar">
    <h2>Tools</h2>
    <button class="sidebar-option active" data-mode="translate">Translate PDF</button>
    <button class="sidebar-option" data-mode="localize">Localize PDF Images</button>
    <button class="sidebar-option" data-mode="regenerate">Regenerate PDF Images</button>
    <button class="sidebar-option" data-mode="redesign">Redesign PDF (AI)</button>
    <button class="sidebar-option" data-mode="fix">Fix PDF</button>
    <button class="sidebar-option" data-mode="digits">Remap Digits</button>
    <button class="sidebar-option" data-mode="split">Split Spread Pages</button>
    <button class="sidebar-option" data-mode="extract_images">Extract Images</button>
    <button class="sidebar-option" data-mode="localize_images">Localize Images</button>
    <!-- Its own window: Page Fix is a session, not a one-shot upload, so it cannot be a
         mode of the form above. Plain link, and a class of its own, so none of the mode
         JS applies to it. -->
    <a class="sidebar-link" href="/pagefix">Fix a Page (AI) ↗</a>
    <!-- Its own window too: merging takes a list of files in a chosen order, which the
         single-file card above cannot express. -->
    <a class="sidebar-link" href="/merge">Merge DOCX Files ↗</a>
  </div>

  <div class="main">
    <div class="card">
      <h1 id="title">PDF Translator</h1>
      <p class="sub" id="subtitle">English → বাংলা · layout preserved</p>

      <div id="drop">
        <span id="dropLabel">Drop a PDF here or click to choose a file</span>
        <div id="fileName"></div>
      </div>

      <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
      <input type="file" id="imageInput" accept="image/*" multiple hidden>

      <button id="actionBtn" disabled>Translate to Bangla</button>
      <div id="hint" class="sub"></div>
      <div id="status"></div>
    </div>
  </div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const imageInput = document.getElementById('imageInput');
const actionBtn = document.getElementById('actionBtn');
const status = document.getElementById('status');
const fileNameEl = document.getElementById('fileName');
const dropLabel = document.getElementById('dropLabel');
const hint = document.getElementById('hint');
let file = null;
let files = null;

const MODES = {
  translate: {
    endpoint: '/translate', label: 'Translate to Bangla', suffix: '_bn.pdf',
    busy: 'Translating… this can take a while for long PDFs.',
    hint: 'Every text block is translated to Bangla; layout, images and graphics are preserved.',
    acceptType: 'application/pdf,.pdf',
  },
  localize: {
    endpoint: '/localize', label: 'Localize Images', suffix: '_localized.pdf',
    busy: 'Localizing images… this can take a while while each image is checked and redrawn.',
    hint: 'Culturally-specific images are adapted to Bangladeshi culture and placed back exactly. Logos, charts and icons are left untouched.',
    acceptType: 'application/pdf,.pdf',
  },
  regenerate: {
    endpoint: '/regenerate', label: 'Regenerate Images', suffix: '_regen.pdf',
    busy: 'Regenerating images… each one is checked, redrawn and put back in place.',
    hint: 'Every image is redrawn for a Bangladeshi audience and swapped back into its exact position. Text inside an image is translated; logos, medical figures and the page\'s own text are left untouched.',
    acceptType: 'application/pdf,.pdf',
  },
  redesign: {
    endpoint: '/redesign', label: 'Redesign PDF (AI)', suffix: '_redesigned.pdf',
    busy: 'Redesigning… this can take a while as every page is re-planned and rebuilt.',
    hint: 'Every page is rebuilt from scratch onto a consistent set of layouts: text is translated, images are culturally adapted for Bangladesh, and logos are kept untouched. Page count and page numbers stay the same as the original.',
    acceptType: 'application/pdf,.pdf',
  },
  fix: {
    endpoint: '/fix', label: 'Fix Bangla PDF', suffix: '_fix.pdf',
    busy: 'Fixing… re-checking every page for missed translations and overlapping text.',
    hint: 'Upload a translated _bn.pdf. Text that was never translated is translated again, and text overlapping its neighbour is re-fitted. Pages with no problems are left untouched.',
    acceptType: 'application/pdf,.pdf',
  },
  digits: {
    endpoint: '/digits', label: 'Remap Digits to Bangla', suffix: '_digits.pdf',
    busy: 'Remapping digits… converting Latin numerals to Bengali (no AI).',
    hint: 'Works on any PDF — no prior Translate needed. Latin digits such as 2025 become ২০২৫. No AI is used. Pages with no Latin digits are left untouched.',
    acceptType: 'application/pdf,.pdf',
  },
  split: {
    endpoint: '/split', label: 'Split Spread Pages', suffix: '_split.pdf',
    busy: 'Splitting… checking each page for a two-up spread.',
    hint: 'Print layouts often put two facing pages on one wide sheet. Each such sheet is cut down the gutter into two pages. Pages with content crossing the middle are left alone. Translate already does this — use it for PDFs made before.',
    acceptType: 'application/pdf,.pdf',
  },
  extract_images: {
    endpoint: '/extract_images', label: 'Extract Images', suffix: '_images.zip',
    busy: 'Extracting images… gathering all images from your PDF.',
    hint: 'All images are extracted from the PDF and saved in a ZIP file, organized by page and image number.',
    acceptType: 'application/pdf,.pdf',
  },
  localize_images: {
    endpoint: '/localize_images', label: 'Localize Images', suffix: '_localized',
    busy: 'Localizing images… reading the text, translating it, adapting the artwork.',
    hint: 'Upload images — screenshots included. Text is read and rewritten in Bangla in its own place, logos and brand marks are left exactly as they are, and the artwork is adapted to Bangladeshi culture unless the picture is a screenshot, form or chart whose layout has to survive. Each localized image is downloaded separately.',
    acceptType: 'image/*',
  },
};
let mode = 'translate';

function applyMode(next) {
  mode = next;
  document.querySelectorAll('.sidebar-option').forEach(opt =>
    opt.classList.toggle('active', opt.dataset.mode === mode));

  const cfg = MODES[mode];
  actionBtn.textContent = cfg.label;
  hint.textContent = cfg.hint;
  status.textContent = '';
  status.className = '';
  file = null;
  files = null;
  fileNameEl.textContent = '';
  actionBtn.disabled = true;

  if (mode === 'localize_images') {
    dropLabel.textContent = 'Drop images here or click to choose files';
    drop.style.minHeight = '200px';
  } else {
    dropLabel.textContent = 'Drop a PDF here or click to choose a file';
  }
}

document.querySelectorAll('.sidebar-option').forEach(opt =>
  opt.addEventListener('click', () => applyMode(opt.dataset.mode)));

function setFile(f) {
  if (!f) return;
  const cfg = MODES[mode];
  if (mode === 'localize_images') {
    if (!f.type.startsWith('image/')) {
      status.textContent = 'Please choose an image file.';
      status.className = 'error';
      return;
    }
    files = [f];
    fileNameEl.textContent = f.name;
  } else {
    if (!f.name.toLowerCase().endsWith('.pdf')) {
      status.textContent = 'Please choose a PDF file.';
      status.className = 'error';
      return;
    }
    file = f;
    fileNameEl.textContent = f.name;
  }
  actionBtn.disabled = false;
  status.textContent = '';
  status.className = '';
}

function setFiles(fileList) {
  if (!fileList || fileList.length === 0) return;
  let invalidFound = false;
  for (let f of fileList) {
    if (!f.type.startsWith('image/')) {
      invalidFound = true;
      break;
    }
  }
  if (invalidFound) {
    status.textContent = 'Please choose only image files.';
    status.className = 'error';
    return;
  }
  files = Array.from(fileList);
  fileNameEl.textContent = `${files.length} image(s) selected`;
  actionBtn.disabled = false;
  status.textContent = '';
  status.className = '';
}

drop.addEventListener('click', () => {
  if (mode === 'localize_images') {
    imageInput.click();
  } else {
    fileInput.click();
  }
});
fileInput.addEventListener('change', () => setFile(fileInput.files[0]));
imageInput.addEventListener('change', () => setFiles(imageInput.files));
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('over');
  if (mode === 'localize_images') {
    setFiles(e.dataTransfer.files);
  } else {
    setFile(e.dataTransfer.files[0]);
  }
});

actionBtn.addEventListener('click', async () => {
  if (mode === 'localize_images') {
    if (!files || files.length === 0) return;
    await uploadImages();
  } else {
    if (!file) return;
    await uploadFile();
  }
});

async function uploadFile() {
  const cfg = MODES[mode];
  actionBtn.disabled = true;
  status.className = '';
  status.innerHTML = '<span class="spinner"></span>' + cfg.busy;
  try {
    const form = new FormData();
    form.append('file', file);
    const res = await fetch(cfg.endpoint, { method: 'POST', body: form });
    if (!res.ok) {
      let msg = 'Request failed.';
      try { msg = (await res.json()).detail || msg; } catch {}
      throw new Error(msg);
    }
    const summary = res.headers.get('X-Fix-Summary') || res.headers.get('X-Regen-Summary')
      || res.headers.get('X-Split-Summary') || res.headers.get('X-Digit-Summary');
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = file.name.replace(/\.pdf$/i, '') + cfg.suffix;
    a.click();
    URL.revokeObjectURL(a.href);

    let docxOk = null;
    if (mode === 'translate') {
      try {
        const docxForm = new FormData();
        docxForm.append('file', blob, a.download);
        const docxRes = await fetch('/export_docx', { method: 'POST', body: docxForm });
        if (!docxRes.ok) throw new Error();
        const docxBlob = await docxRes.blob();
        const da = document.createElement('a');
        da.href = URL.createObjectURL(docxBlob);
        da.download = file.name.replace(/\.pdf$/i, '') + '_bn.docx';
        da.click();
        URL.revokeObjectURL(da.href);
        docxOk = true;
      } catch {
        docxOk = false;
      }
    }

    if (docxOk === true) {
      status.textContent = 'Done — PDF and DOCX downloaded.';
    } else if (docxOk === false) {
      status.textContent = 'Done — PDF downloaded; DOCX export failed.';
    } else {
      status.textContent = summary
        ? 'Done — ' + summary
        : 'Done — your download should start automatically.';
    }
  } catch (err) {
    status.textContent = err.message;
    status.className = 'error';
  } finally {
    actionBtn.disabled = false;
  }
}

async function uploadImages() {
  const cfg = MODES[mode];
  actionBtn.disabled = true;
  status.className = '';
  status.innerHTML = '<span class="spinner"></span>' + cfg.busy;
  try {
    for (const img of files) {
      const form = new FormData();
      form.append('file', img);
      const res = await fetch(cfg.endpoint, { method: 'POST', body: form });
      if (!res.ok) {
        let msg = `Failed to localize ${img.name}.`;
        try { msg = (await res.json()).detail || msg; } catch {}
        throw new Error(msg);
      }
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = img.name.replace(/\.[^.]+$/, '_localized$&');
      a.click();
      URL.revokeObjectURL(a.href);
    }
    status.textContent = `Done — ${files.length} image(s) localized and downloaded.`;
  } catch (err) {
    status.textContent = err.message;
    status.className = 'error';
  } finally {
    actionBtn.disabled = false;
  }
}

applyMode('translate');
</script>
</body>
</html>
